# Render blueprint for the Aurex Truck Parts API (Docker web service).
# In Render: New → Blueprint → point at this repo. Then fill the `sync:false`
# secrets in the dashboard. Pair with MongoDB Atlas for the database.
services:
  - type: web
    name: truck-parts-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGO_URI          # Atlas connection string
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: APP_URL            # storefront URL, e.g. https://aurex.com.au
        sync: false
      - key: CLIENT_ORIGINS     # comma-separated storefront + admin origins
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORE_INBOX_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
