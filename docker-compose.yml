# One-command local stack: MongoDB + the API.
#   docker compose up --build
# The API seeds itself on first run (see the `seed` service), then serves on :5000.
# No MongoDB Atlas account needed for local development.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    build: .
    command: ["node", "src/seed/seed.js"]
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/aurex
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/aurex
      NODE_ENV: production
      PORT: 5000
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  mongo-data:
  uploads-data:
